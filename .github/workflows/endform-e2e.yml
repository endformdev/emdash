name: Endform E2E

on:
  pull_request:
  workflow_dispatch:
    inputs:
      concurrency:
        description: Maximum tests running at once
        default: "64"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node E2E on Endform (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      ENDFORM_API_KEY: ${{ secrets.ENDFORM_API_KEY_JOXDCDJD }}
      EMDASH_ENDFORM_CONCURRENCY: ${{ inputs.concurrency || '64' }}
      ENDFORM_GIT_BRANCH: ${{ github.head_ref || github.ref_name }}
      ENDFORM_GIT_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build fixture dependencies
        run: pnpm run --filter "emdash-e2e-fixture..." build
      - name: Run parallel E2E on Endform
        id: parallel
        run: pnpm exec endform test --organization-id jOXdcdjD --project chromium
      - name: Run exclusive E2E on Endform
        id: exclusive
        if: ${{ !cancelled() }}
        run: pnpm exec endform test --organization-id jOXdcdjD --project exclusive
